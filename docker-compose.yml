services:
  web:
    build: .
    environment:
      NODE_ENV:
      MONGODB_URI: mongodb://mongo:27017/nodegoat
      SESSION_SECRET: ${SESSION_SECRET}
      CRYPTO_KEY: ${CRYPTO_KEY}
    command: sh -c "until nc -z -w 2 mongo 27017; do sleep 2; done; node artifacts/db-reset.js && npm start"
    ports:
      - "4000:4000"

  mongo:
    image: mongo:4.4
    user: mongodb
    expose:
      - 27017