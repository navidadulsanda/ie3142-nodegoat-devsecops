name: CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nodegoat:ci .
      - name: Smoke test the stack
        env:
          SESSION_SECRET: ci-not-a-real-secret
          CRYPTO_KEY: ci-not-a-real-secret
        run: |
          docker compose up -d --build
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/login >/dev/null; then
              echo "App is up"; docker compose down; exit 0
            fi
            sleep 3
          done
          echo "App did not start"; docker compose logs; docker compose down; exit 1

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Semgrep (blocking)
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten --config p/nodejs \
            --config p/security-audit --config .semgrep/ \
            --error --severity ERROR .

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: npm audit (warn-only, intentional)
        run: npm audit --audit-level=high || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks (blocking)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nodegoat:ci .
      - name: Trivy scan (visible, non-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'nodegoat:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'
