name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: npm test || true

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (Semgrep needs it)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep --config p/owasp-top-ten --config p/nodejs . || true  
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm audit --audit-level=high || true

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nodegoat:ci .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nodegoat:ci'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'   # still warn-only today